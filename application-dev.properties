
#Admin server
spring.boot.admin.client.url=http://localhost:1111

#zipkin Server
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans

# Eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# H2 Database
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=Mouni@3501

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Important - run SQL scripts
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

#actuators 
management.endpoints.web.exposure.include = *
management.endpoint.health.show-details=always

#when you check infromation in actuator you will see this infromation
info.app.name = CurrencyConversionService
info.app.description = Handles currency conversion amount.
info.app.version = 1.0.0
info.author = Sathyatech

#after uploading this details if you wnat to see this details in infor actuator you 
#must have this line so that you can see this actuator 
management.info.env.enabled=true

#circuit beaker  infromation
resilience4j.circuitbreaker.instances.myCircuitBraker.slidingWindowSize=10
resilience4j.circuitbreaker.instances.myCircuitBraker.failureRateThreshold=50
resilience4j.circuitbreaker.instances.myCircuitBraker.waitDurationInOpenState=30s
resilience4j.circuitbreaker.instances.myCircuitBraker.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.myCircuitBraker.permitted-number-of-calls-in-half-open-state=5
